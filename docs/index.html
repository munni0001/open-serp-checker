<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SERP Rankings — 2026-11-18</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f9fa;
      --surface: #fff;
      --border: #dee2e6;
      --text: #212529;
      --muted: #6c757d;
      --up: #198754;
      --dn: #dc3545;
      --eq: #6c757d;
      --accent: #0d6efd;
      --chart-bg: #f1f3f5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --surface: #1c1f24;
        --border: #2d3038;
        --text: #e9ecef;
        --muted: #868e96;
        --up: #40c074;
        --dn: #f06070;
        --eq: #868e96;
        --accent: #4d94ff;
        --chart-bg: #15181d;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      padding: 24px 32px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }

    .updated { font-size: 12px; color: var(--muted); }

    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

    section { margin-bottom: 36px; }

    section h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .domain {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .kw-row { cursor: pointer; user-select: none; }
    .kw-row:hover td { background: var(--bg); }

    .chart-row td { padding: 0; }

    .term { font-weight: 500; min-width: 180px; }

    .pos {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    td.up { color: var(--up); font-weight: 600; text-align: right; white-space: nowrap; }
    td.dn { color: var(--dn); font-weight: 600; text-align: right; white-space: nowrap; }
    td.eq { color: var(--eq); text-align: right; }
    td.na { color: var(--muted); text-align: right; }

    .spark { padding: 6px 14px; vertical-align: middle; }
    .spark svg { display: block; overflow: visible; }

    .eng { font-size: 12px; color: var(--muted); }
    .ts  { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .empty { color: var(--muted); padding: 24px 0; }

    /* Chart panel */
    .chart-panel {
      padding: 12px 16px 16px;
      background: var(--chart-bg);
      border-top: 1px solid var(--border);
    }

    .cm { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .cc { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .cno { font-size: 12px; color: var(--muted); padding: 8px 0 4px; }

    .csvg { width: 100%; height: auto; display: block; overflow: visible; }
    .cg  { stroke: var(--border); stroke-dasharray: 3 3; }
    .cy  { font-size: 10px; fill: var(--muted); text-anchor: end; font-family: inherit; }
    .cx  { font-size: 10px; fill: var(--muted); text-anchor: middle; font-family: inherit; }
    .cl  { fill: none; stroke: var(--accent); stroke-width: 1.5;
            stroke-linejoin: round; stroke-linecap: round; }
    .cd      { fill: var(--accent); }
    .cd-last { fill: #f59f00; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>SERP Rankings</h1>
    <span class="updated">Updated 2026-11-18 06:12 UTC</span>
  </header>
  <main>
<p class="empty">No keyword data yet. Run your first check from the dashboard.</p>
  </main>
  <script>
    const HISTORY = {};
    const META    = {};

    function toggleChart(id) {
      const row   = document.getElementById('cr-' + id);
      const panel = document.getElementById('cp-' + id);
      if (row.style.display === 'none') {
        row.style.display = '';
        if (!panel.dataset.built) {
          panel.innerHTML = buildChart(id);
          panel.dataset.built = '1';
        }
      } else {
        row.style.display = 'none';
      }
    }

    function buildChart(id) {
      const pts  = HISTORY[id] || [];
      const meta = META[id]    || {};

      const metaHtml =
        '<div class="cm">' + (meta.pts || 0) + ' data points' +
        (meta.ts ? ' &middot; latest ' + meta.ts : '') + '</div>' +
        '<div class="cc">' + (meta.cfg || '') + '</div>';

      if (!pts.length) {
        return metaHtml + '<div class="cno">No position data yet — will appear after the first successful check.</div>';
      }

      const W = 760, H = 100;
      const ML = 44, MR = 20, MT = 10, MB = 26;
      const CW = W - ML - MR, CH = H - MT - MB;

      const positions = pts.map(p => p.pos);
      const times     = pts.map(p => new Date(p.ts));

      let minP = Math.min(...positions);
      let maxP = Math.max(...positions);
      const spread = maxP - minP;
      const pad = spread < 3 ? Math.max(2, Math.ceil(spread * 0.5 + 1)) : Math.ceil(spread * 0.3);
      minP = Math.max(1, minP - pad);
      maxP = maxP + pad;
      const pRange = maxP - minP || 1;

      const minT = times[0].getTime();
      const maxT = times[times.length - 1].getTime();
      const tRange = maxT - minT || 1;

      const sx = t  => ML + (t.getTime() - minT) / tRange * CW;
      const sy = p  => MT + (p - minP) / pRange * CH;

      let svg = '';

      // Y-axis grid + labels
      const allY = [];
      for (let p = Math.ceil(minP); p <= Math.floor(maxP); p++) allY.push(p);
      const yStep = Math.max(1, Math.ceil(allY.length / 5));
      for (let i = 0; i < allY.length; i += yStep) {
        const p = allY[i];
        const y = sy(p).toFixed(1);
        svg += '<line x1="' + ML + '" y1="' + y + '" x2="' + (ML+CW) + '" y2="' + y + '" class="cg"/>';
        svg += '<text x="' + (ML-5) + '" y="' + (parseFloat(y)+3.5).toFixed(1) + '" class="cy">' + p + '</text>';
      }

      // X-axis date labels (up to 4)
      const nX = Math.min(pts.length, 4);
      for (let i = 0; i < nX; i++) {
        const idx = Math.round(i / Math.max(nX - 1, 1) * (pts.length - 1));
        const t   = times[idx];
        const x   = sx(t).toFixed(1);
        const lbl = t.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'});
        svg += '<text x="' + x + '" y="' + (H-4) + '" class="cx">' + lbl + '</text>';
      }

      // Data line
      const linePts = pts.map((p, i) => sx(times[i]).toFixed(1) + ',' + sy(p.pos).toFixed(1)).join(' ');
      svg += '<polyline points="' + linePts + '" class="cl"/>';

      // Dots
      for (let i = 0; i < pts.length; i++) {
        const x = sx(times[i]).toFixed(1);
        const y = sy(pts[i].pos).toFixed(1);
        const cls = i === pts.length - 1 ? 'cd-last' : 'cd';
        const r   = i === pts.length - 1 ? 4 : 2.5;
        svg += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" class="' + cls + '"/>';
      }

      return metaHtml + '<svg viewBox="0 0 ' + W + ' ' + H + '" class="csvg" aria-hidden="true">' + svg + '</svg>';
    }
  </script>
</body>
</html>
