[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-serp-checker"
version = "0.1.0"
description = "Self-hosted SERP rank tracker with pluggable providers (Bing, Google, SearXNG, DataForSEO, Serper) and provider-aware proxy support."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "munni0001" }]
keywords = ["seo", "serp", "rank-tracker", "scraping", "self-hosted", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "jinja2>=3.1,<4.0",
    "playwright>=1.47,<2.0",
    "camoufox[geoip]>=0.5,<1.0",
    "curl-cffi>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/munni0001/open-serp-checker"

[project.scripts]
open-serp-checker = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# v0.1 lint posture: block only on correctness bugs (F = pyflakes: undefined
# names, unused imports, syntax). Style modernization (UP), import sorting (I),
# and whitespace (W) are intentionally off — the existing codebase pre-dates
# ruff, and a bulk reformat belongs in its own PR. Tighten these over time.
select = ["F"]
ignore = ["F841"]  # unused variable — appears in some generated/scaffolded code

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
