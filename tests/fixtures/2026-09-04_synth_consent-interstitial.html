<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Before you continue to Google</title>
</head><body>
<h1>Before you continue to Google</h1>
<p>Google uses cookies and data to deliver services...</p>
<form action="https://consent.google.com/save" method="POST">
  <input type="hidden" name="continue" value="https://www.google.com/search?q=test">
  <button name="set_eom" value="true">Reject all</button>
  <button name="set_eom" value="false">Accept all</button>
</form>
</body></html>
